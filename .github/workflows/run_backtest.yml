name: Run XAUUSD TPO+VWAP Backtest

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run TPO + VWAP Quant Backtest & Build HTML Dashboard
        run: |
          python main_backtest.py
          python generate_html_dashboard.py

      - name: Upload HTML Dashboard & CSV Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backtest-dashboard-bundle
          path: |
            outputs/dashboard.html
            outputs/trade_history_export.csv
          retention-days: 30

      - name: Publish Dashboard to Repo (For GitHub Pages)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          cp outputs/dashboard.html index.html
          git add -f index.html outputs/dashboard.html outputs/trade_history_export.csv
          git commit -m "Update V9 HTML dashboard and backtest report" || exit 0
          git pull origin main --rebase -X ours
          git push origin main
